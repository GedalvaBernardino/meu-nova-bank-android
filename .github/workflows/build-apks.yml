name: Build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Meu Nova Bank
            archive: MEU-NOVA-BANK-Android-Studio-v0.2.15.zip
            project: MEU-NOVA-BANK-Android-Studio-v0.2.15
            artifact: meu-nova-bank-apk
          - name: Meu Nova Bank Admin
            archive: MEU-NOVA-BANK-ADMIN-Android-Studio-v0.2.7.zip
            project: MEU-NOVA-BANK-ADMIN-Android-Studio-v0.2.7
            artifact: meu-nova-bank-admin-apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'build-tools;37.0.0'
      - name: Unpack source
        run: unzip -q "${{ matrix.archive }}"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        working-directory: ${{ matrix.project }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
